name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04 # pinned: setup-ruby v1.195.0 predates ubuntu-26.04
    environment: release
    permissions:
      contents: read
      id-token: write # RubyGems trusted publishing (OIDC)
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
    - uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633 # tag v4.1.2
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@086ffb1a2090c870a3f881cc91ea83aa4243d408 # v1.195.0
      with:
        ruby-version: 3.2

    - name: Determine version
      id: version
      run: echo "VERSION=$(ruby -r ./lib/newrelic_security/version -e 'puts NewRelic::Security::VERSION')" >> "$GITHUB_OUTPUT"

    - name: Build newrelic_security gem
      run: gem build newrelic_security.gemspec

    - name: Configure RubyGems trusted publishing credentials
      uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # tag v2.1.0

    - name: Publish newrelic_security to rubygems.org
      run: |
        if ! output=$(gem push newrelic_security-*.gem 2>&1); then
          echo "$output"
          echo "$output" | grep -q 'Repushing of gem versions is not allowed' || exit 1
          echo "Version already published, skipping"
        else
          echo "$output"
        fi

  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
    - name: Create github release
      run: |
        if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          echo "Release $VERSION already exists, skipping"
        else
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes ''
        fi
